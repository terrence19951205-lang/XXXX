.desktop::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 75% 60% at 50% 45%, transparent 42%, rgba(0,0,0,0.28) 100%);
}
.desk-hit {
  position: absolute; width: 9px; height: 9px; border-radius: 50%;
  border: 1px solid rgba(0,229,255,0.65); pointer-events: none; opacity: 0; z-index: 2;
  box-shadow: 0 0 7px rgba(0,229,255,0.35);
}
.desk-hit.show { animation: hitPulse .4s var(--ease) forwards; }
@keyframes hitPulse { 0%{opacity:.8;transform:scale(.35)} 100%{opacity:0;transform:scale(2.3)} }

.cut { clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); }
.cut-sm { clip-path: polygon(var(--cut-sm) 0, calc(100% - var(--cut-sm)) 0, 100% var(--cut-sm), 100% calc(100% - var(--cut-sm)), calc(100% - var(--cut-sm)) 100%, var(--cut-sm) 100%, 0 calc(100% - var(--cut-sm)), 0 var(--cut-sm)); }

.panel {
  position: relative;
  background: linear-gradient(180deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.01) 18%, transparent 42%), var(--glass);
  backdrop-filter: blur(20px) saturate(1.15);
  -webkit-backdrop-filter: blur(20px) saturate(1.15);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), inset 0 -1px 0 rgba(0,0,0,0.28), 0 12px 40px rgba(0,0,0,0.32);
}
.panel > .edge { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
.panel > .edge path.base { fill: none; stroke: rgba(0,229,255,0.22); stroke-width: 1; vector-effect: non-scaling-stroke; }
.panel > .edge path.hi { fill: none; stroke: rgba(0,229,255,0.5); stroke-width: 1.1; vector-effect: non-scaling-stroke; stroke-dasharray: 22 280; stroke-dashoffset: 2; opacity: .9; }

/* ===== DYNAMIC ISLAND (always on, pointer-events auto) ===== */
.island-wrap {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  z-index: 45; pointer-events: auto;
  display: flex; flex-direction: column; align-items: center;
}
.island {
  position: relative;
  width: var(--island-w);
  min-height: 40px;
  border-radius: var(--island-r);
  background:
    linear-gradient(180deg, rgba(28,36,48,0.96) 0%, rgba(8,12,20,0.97) 100%);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.1),
    inset 0 0 0 1px rgba(0,229,255,0.2),
    0 10px 32px rgba(0,0,0,0.55),
    0 0 24px rgba(0,229,255,0.04);
  overflow: hidden;
  transition:
    width var(--t-island) var(--ease-island),
    min-height var(--t-island) var(--ease-island),
    border-radius var(--t-island) var(--ease-island),
    box-shadow var(--t-hover);
  cursor: pointer;
}
.island:hover {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.12),
    inset 0 0 0 1px rgba(0,229,255,0.38),
    0 12px 36px rgba(0,0,0,0.58),
    0 0 28px rgba(0,229,255,0.07);
}
.island.is-chat {
  width: var(--island-chat-w);
  min-height: min(58vh, 520px);
  border-radius: 26px;
  cursor: default;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.1),
    inset 0 0 0 1px rgba(0,229,255,0.28),
    0 20px 60px rgba(0,0,0,0.55),
    0 0 40px rgba(0,229,255,0.06);
}

/* collapsed island face */
.island-face {
  display: flex; align-items: center; gap: 10px;
  height: 40px; padding: 0 12px 0 14px;
  transition: opacity var(--t-collapse), height var(--t-island) var(--ease-island);
}
.island.is-chat .island-face { height: 44px; border-bottom: 1px solid rgba(0,229,255,0.1); cursor: default; }
.island-led {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 8px rgba(0,229,255,0.7); flex-shrink: 0;
}

            <span class="en" id="islandEn">Reality Raid</span>
          </div>
          <div class="island-decay">
            <span class="island-pct" id="islandPct">—%</span>
            <span class="island-ring" aria-hidden="true">
              <svg viewBox="0 0 22 22"><circle class="track" cx="11" cy="11" r="8"></circle>
              <circle class="fg" id="islandRingFg" cx="11" cy="11" r="8"></circle></svg>

            <button type="button" class="island-gear" id="btnHours" title="设定上下班" aria-label="设定上下班">⚙</button>

      </div>
      <div class="hours-pop panel cut" id="hoursPop">
        <h4>工作窗口</h4>
        <div class="row">
          <div style="flex:1"><label>开日</label><input class="cut-sm" id="inStart" type="time" value="09:30" /></div>
          <div style="flex:1"><label>下班</label><input class="cut-sm" id="inEnd" type="time" value="22:30" /></div>
        </div>
        <div class="acts">
          <button type="button" class="btn sm cut-sm" id="btnHoursCancel">取消</button>

    </div>

    <button type="button" class="evoke cut" id="btnEvoke" title="展开 / 收起头盔" aria-expanded="false">
      <span class="evoke-body">
        <span class="evoke-led" aria-hidden="true"></span>

      <span class="evoke-go"><span id="evokeLabel">展开</span> <kbd>Esc</kbd></span>

    <div class="fx" id="fx" aria-hidden="true">

      <div class="grain"></div><div class="chroma"></div>

      <div class="glance panel cut" id="glance" aria-hidden="true">

        <div class="line" id="glance2">—</div>

      <div class="dock hit" id="dock">
        <nav class="rail panel cut" aria-label="P0 入口">

          <button type="button" class="nav-btn cut-sm" data-panel="todos" title="待办"><span class="ico">01</span><span class="lab cut-sm">待办</span><span class="badge" id="badgeTodos"></span></button>
          <button type="button" class="nav-btn cut-sm" data-panel="chat" title="聊天"><span class="ico">02</span><span class="lab cut-sm">聊天</span></button>
          <button type="button" class="nav-btn cut-sm" data-panel="notes" title="笔记"><span class="ico">03</span><span class="lab cut-sm">笔记</span></button>
          <button type="button" class="nav-btn cut-sm" data-panel="clip" title="剪贴板"><span class="ico">04</span><span class="lab cut-sm">剪贴板</span><span class="badge" id="badgeClip"></span></button>
          <button type="button" class="nav-btn cut-sm" data-panel="launch" title="启动"><span class="ico">05</span><span class="lab cut-sm">启动</span></button>
          <button type="button" class="nav-btn cut-sm" data-panel="search" title="搜索"><span class="ico">06</span><span class="lab cut-sm">搜索</span></button>
        </nav>

        <section class="work panel cut" id="work" aria-label="工作面板">
          <svg class="edge" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path class="base" d="M7,0 H93 L100,7 V93 L93,100 H7 L0,93 V7 Z"/>
            <path class="hi" d="M7,0 H93 L100,7 V93 L93,100 H7 L0,93 V7 Z"/>
          </svg>
          <div class="work-hd">
            <div class="title"><span id="workTitle">待办</span><span class="en" id="workEn">Ops</span></div>
            <button type="button" class="close cut-sm" id="btnClosePanel" title="关闭面板">✕</button>
          </div>
          <div class="work-bd" id="workBody"></div>

      <footer class="eave-bot panel cut hit" aria-label="下檐">
        <svg class="edge" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <path class="base" d="M7,0 H93 L100,7 V93 L93,100 H7 L0,93 V7 Z"/>
          <path class="hi" d="M7,0 H93 L100,7 V93 L93,100 H7 L0,93 V7 Z"/>
        </svg>
        <div class="quick-search">
          <span class="tag">Search</span>
          <input class="cut-sm field" id="botSearch" type="search" placeholder="搜待办 / 笔记，回车打开" autocomplete="off" />
        </div>
        <div class="ctx-hint" id="ctxHint">Esc 收起 · 点小岛开聊天</div>
      </footer>

    <div class="toast cut-sm" id="toast" role="status"></div>
  </div>
</div>
<p class="note">REALITY RAID HUD v0.8 · Dynamic Island · PRD v0.4</p>

<script>

(function () {
  const LS = {
    collapse: "rr.v08.collapsed",
    hint: "rr.v08.hint",
    todos: "rr.v08.todos",
    notes: "rr.v08.notes",
    chats: "rr.v08.chats",
    clip: "rr.v08.clip",
    hours: "rr.v08.hours",
    model: "rr.v08.model",
    panel: "rr.v08.panel",
    chatOpen: "rr.v08.chatOpen",
  };
  const LEGACY = {
    todos: "rr.v07.todos", notes: "rr.v07.notes", chats: "rr.v07.chats",
    clip: "rr.v07.clip", hours: "rr.v07.hours", model: "rr.v07.model",
  };
  const R = 8, CIRC = 2 * Math.PI * R, FLASH = 150;
  const $ = (id) => document.getElementById(id);
  const clamp = (n,a,b) => Math.max(a, Math.min(b, n));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const now = () => Date.now();

  function load(key, fallback, legacyKey) {
    try {
      let s = localStorage.getItem(key);
      if (!s && legacyKey) {
        s = localStorage.getItem(legacyKey);
        if (s) localStorage.setItem(key, s);
      }
      return s ? JSON.parse(s) : fallback;
    } catch (_) { return fallback; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (_) {}
  }

  let hours = load(LS.hours, { start: "09:30", end: "22:30" }, LEGACY.hours);
  let todos = load(LS.todos, [
    { id: "t1", title: "按 PRD v0.4 把 P0 面板做通", done: false, updated: now() },
    { id: "t2", title: "日衰可配上下班并落盘", done: false, updated: now() },
    { id: "t3", title: "聊天多会话可切换模型", done: false, updated: now() },
  ], LEGACY.todos);
  let notes = load(LS.notes, [
    { id: "n1", title: "头盔工作台备忘", body: "中央穿透真桌面。\n左檐入口 → 一块面板。\n小岛展开完整聊天。", updated: now() - 86400000 },
    { id: "n2", title: "视觉 token", body: "切角 7px · 薄玻璃 · 青/琥珀\n灵动岛替代满宽上檐。", updated: now() - 3600000 },
  ], LEGACY.notes);
  let chats = load(LS.chats, {
    sessions: [
      { id: "c1", title: "今日开工", updated: now() },
      { id: "c2", title: "交互口径", updated: now() - 7200000 },
    ],
    active: "c1",
    messages: {
      c1: [
        { id: "m1", role: "ai", text: "小岛已上线。我是通用 AI（demo 本地模拟，不绑 claw）。点我展开完整对话。", ts: now() - 60000 },
      ],
      c2: [
        { id: "m2", role: "user", text: "不要复刻原版浮窗。", ts: now() - 7000000 },
        { id: "m3", role: "ai", text: "收到。主路是头盔工作台；聊天走灵动岛舱体。", ts: now() - 6990000 },
      ],
    },
  }, LEGACY.chats);
  let clips = load(LS.clip, [
    { id: "x1", text: "reality-raid-hud-v08.html", ts: now() - 120000 },
    { id: "x2", text: "灵动岛 · 点开完整聊天", ts: now() - 600000 },
    { id: "x3", text: "PRD v0.4 · P0 干活能力", ts: now() - 3600000 },
  ], LEGACY.clip);
  let model = load(LS.model, "Grok · Demo", LEGACY.model);
  const MODELS = ["Grok · Demo", "Claude · Demo", "GPT · Demo"];
  const LAUNCHES = [
    { id: "l1", name: "终端", kind: "应用", hint: "Terminal.app" },
    { id: "l2", name: "代码仓库", kind: "文件夹", hint: "~/workspace/x-hub" },
    { id: "l3", name: "PRD 画布", kind: "网页", hint: "cursor.com/canvas/…" },
    { id: "l4", name: "视觉规范", kind: "网页", hint: "视觉规范 v1.0" },
    { id: "l5", name: "浏览器", kind: "应用", hint: "Chrome" },
  ];

  let activePanel = null; // left panel only; chat is island
  let chatOpen = false;
  let activeNoteId = notes[0] ? notes[0].id : null;
  let collapsed = true;
  try {
    const s = localStorage.getItem(LS.collapse);
    if (s === "0") collapsed = false; else if (s === "1") collapsed = true;
    else {
      const old = localStorage.getItem("rr.v07.collapsed");
      if (old === "0") collapsed = false; else if (old === "1") collapsed = true;
    }
  } catch (_) {}
  try {
    const p = localStorage.getItem(LS.panel);
    if (p && p !== "null" && p !== "chat") activePanel = p;
  } catch (_) {}
  try {
    if (localStorage.getItem(LS.chatOpen) === "1") chatOpen = true;
  } catch (_) {}

  let toastTimer;
  function toast(msg, ok) {
    const el = $("toast");
    el.textContent = msg; el.classList.toggle("ok", !!ok); el.classList.add("is-on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("is-on"), 2200);
  }

  function parseHM(hm) {
    const [h, m] = String(hm).split(":").map(Number);
    const d = new Date(); d.setHours(h || 0, m || 0, 0, 0); return d.getTime();
  }
  function dayDecay() {
    const start = parseHM(hours.start), end = parseHM(hours.end), t = Date.now();
    if (end <= start) return { remain: 0, used: 100 };
    const remain = clamp(Math.round(((end - t) / (end - start)) * 100), 0, 100);
    return { remain, used: 100 - remain };
  }
  function paintRing() {
    const { remain } = dayDecay();
    const fg = $("islandRingFg"), pct = $("islandPct");
    fg.style.strokeDasharray = String(CIRC);
    fg.style.strokeDashoffset = String(CIRC * (1 - remain / 100));
    const warn = remain <= 25;
    fg.classList.toggle("warn", warn); pct.classList.toggle("warn", warn);
    pct.textContent = remain + "%";
  }

  function persistTodos() { save(LS.todos, todos); paintGlance(); paintBadges(); }
  function persistNotes() { save(LS.notes, notes); }
  function persistChats() { save(LS.chats, chats); }
  function persistClip() { save(LS.clip, clips); paintBadges(); }
  function persistHours() { save(LS.hours, hours); paintRing(); }

  function paintGlance() {
    const open = todos.filter(t => !t.done);
    $("glance1").textContent = open[0] ? open[0].title : "今日待办已清空";
    $("glance2").textContent = open[1] ? open[1].title : (open.length ? "其余 " + (open.length - 1) + " 项" : "点左檐 01 管理");
  }
  function paintBadges() {
    const n = todos.filter(t => !t.done).length;
    const b = $("badgeTodos");
    b.textContent = n ? String(n) : ""; b.classList.toggle("is-zero", !n);
    const c = $("badgeClip");
    c.textContent = clips.length ? String(Math.min(clips.length, 9)) : "";
    c.classList.toggle("is-zero", !clips.length);
  }

  const PANEL_META = {
    todos: { title: "待办", en: "Ops", hint: "新增 / 改标题 / 完成 · 已落盘" },
    notes: { title: "笔记", en: "Notes", hint: "列表 + 编辑器 · 自动落盘" },
    clip: { title: "剪贴板", en: "Clip", hint: "点击取用 · 可关面板" },
    launch: { title: "启动", en: "Launch", hint: "调起后回到穿透区" },
    search: { title: "搜索", en: "Find", hint: "搜待办与笔记 · 点击直达" },
  };

  function escapeAttr(s) {
    return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function aiReply(userText, modelName) {
    const t = userText.toLowerCase();
    let reply;
    if (/待办|todo|任务/.test(t)) reply = "待办在左檐 01。余光能瞥见今日；面板里可新增、改标题、勾完成。";
    else if (/笔记|note/.test(t)) reply = "笔记走左檐 03：列表 + 编辑器，写完落盘。";
    else if (/日衰|下班|工时/.test(t)) reply = "日衰在小岛右侧。点 ⚙ 可配上下班。";
    else if (/岛|灵动|聊天|chat/.test(t)) reply = "点居中小岛即可展开完整对话舱体。左檐「聊天」走同一套窗口。";
    else if (/交互|浮窗|仪表盘|bento/.test(t)) reply = "主路是头盔工作台，不是 Bento。满宽上檐已撤，换成灵动岛。";
    else if (/你好|嗨|hello|hi/.test(t)) reply = "在。中央留给真桌面，我在小岛待命。";
    else reply = "已收到：「" + userText.slice(0, 48) + (userText.length > 48 ? "…" : "") + "」。这是 demo 本地模拟回复。";
    return reply + "\n\n（模型：" + modelName + " · 通用 AI，不绑 claw）";
  }

  /* ---- Island chat ---- */
  function setChatOpen(v) {
    chatOpen = !!v;
    try { localStorage.setItem(LS.chatOpen, chatOpen ? "1" : "0"); } catch (_) {}
    const island = $("island");
    island.classList.toggle("is-chat", chatOpen);
    island.setAttribute("aria-expanded", chatOpen ? "true" : "false");
    $("islandCn").textContent = chatOpen ? "聊天 · Comms" : "现实突袭";
    $("islandEn").textContent = chatOpen ? "通用 AI · 不绑 claw" : "Reality Raid";
    if (chatOpen) {
      // close left panels when opening chat
      if (activePanel) {
        activePanel = null;
        try { localStorage.setItem(LS.panel, "null"); } catch (_) {}
        applyLeftPanel();
        renderWork();
      }
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("is-on", btn.dataset.panel === "chat");
      });
      renderIslandChat();
      $("ctxHint").innerHTML = "<b>聊天</b> · 通用 AI · demo 本地模拟 · 不绑 claw";
    } else {
      document.querySelectorAll('.nav-btn[data-panel="chat"]').forEach(b => b.classList.remove("is-on"));
      $("islandChat").innerHTML = "";
      if (!activePanel) $("ctxHint").textContent = "Esc 收起 · 点小岛开聊天";
    }
  }

  function renderIslandChat() {
    if (!chats.active || !chats.messages[chats.active]) {
      chats.active = chats.sessions[0] && chats.sessions[0].id;
    }
    const body = $("islandChat");
    body.innerHTML = `
      <div class="chat-wrap">
        <div>
          <div class="chat-top">
            <select class="cut-sm" id="modelSel" title="模型"></select>
            <button type="button" class="btn sm cut-sm" id="newSess">新会话</button>
            <button type="button" class="btn sm cut-sm" id="closeChat">收起</button>
          </div>
          <div class="sess-list" id="sessList" style="margin-top:6px"></div>
        </div>
        <div class="msgs" id="msgList"></div>
        <div class="composer">
          <textarea class="cut-sm" id="chatInput" placeholder="输入消息，⌘/Ctrl+Enter 发送"></textarea>
          <button type="button" class="btn primary cut-sm" id="chatSend">发送</button>
        </div>
      </div>`;
    const sel = $("modelSel");
    sel.innerHTML = MODELS.map(m => `<option value="${m}" ${m===model?"selected":""}>${m}</option>`).join("");
    sel.onchange = () => { model = sel.value; save(LS.model, model); };
    const sessList = $("sessList");
    sessList.innerHTML = chats.sessions.map(s =>
      `<button type="button" class="sess cut-sm ${s.id===chats.active?"is-on":""}" data-id="${s.id}">${escapeHtml(s.title)}</button>`
    ).join("");
    sessList.querySelectorAll(".sess").forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); chats.active = btn.dataset.id; persistChats(); renderIslandChat(); };
    });
    $("newSess").onclick = (e) => {
      e.stopPropagation();
      const id = uid();
      chats.sessions.unshift({ id, title: "会话 " + (chats.sessions.length + 1), updated: now() });
      chats.messages[id] = [{ id: uid(), role: "ai", text: "新会话已打开。通用 AI demo，不绑 claw。", ts: now() }];
      chats.active = id; persistChats(); renderIslandChat();
    };
    $("closeChat").onclick = (e) => { e.stopPropagation(); setChatOpen(false); };
    const msgList = $("msgList");
    const msgs = chats.messages[chats.active] || [];
    msgList.innerHTML = msgs.map(m => `
      <div class="msg cut-sm ${m.role==="user"?"user":"ai"}">
        <div class="who">${m.role==="user"?"You":"AI"}</div>
        <div>${escapeHtml(m.text).replace(/\n/g,"<br>")}</div>
        ${m.role==="ai"?'<div class="note-ai">通用 AI · 本地模拟 · 不绑 claw</div>':""}
      </div>`).join("");
    msgList.scrollTop = msgList.scrollHeight;
    const send = () => {
      const inp = $("chatInput");
      const text = (inp.value || "").trim();
      if (!text) return;
      const sid = chats.active;
      if (!chats.messages[sid]) chats.messages[sid] = [];
      chats.messages[sid].push({ id: uid(), role: "user", text, ts: now() });
      chats.messages[sid].push({ id: uid(), role: "ai", text: aiReply(text, model), ts: now() });
      const sess = chats.sessions.find(s => s.id === sid);
      if (sess) {
        sess.updated = now();
        if (sess.title.startsWith("会话") || sess.title === "今日开工")
          sess.title = text.slice(0, 12) + (text.length > 12 ? "…" : "");
      }
      persistChats(); inp.value = ""; renderIslandChat();
    };
    $("chatSend").onclick = (e) => { e.stopPropagation(); send(); };
    $("chatInput").onclick = (e) => e.stopPropagation();
    $("chatInput").onkeydown = e => {
      e.stopPropagation();
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
    };
    body.onclick = (e) => e.stopPropagation();
  }

  /* ---- Left panels (no chat body here) ---- */
  function setPanel(id) {
    if (id === "chat") {
      setChatOpen(true);
      return;
    }
    if (id && activePanel === id) activePanel = null;
    else activePanel = id || null;
    try { localStorage.setItem(LS.panel, activePanel || "null"); } catch (_) {}
    // opening a left panel closes island chat
    if (activePanel && chatOpen) setChatOpen(false);
    applyLeftPanel();
    renderWork();
  }

  function applyLeftPanel() {
    document.querySelectorAll(".nav-btn").forEach(btn => {
      const on = btn.dataset.panel === "chat" ? chatOpen : btn.dataset.panel === activePanel;
      btn.classList.toggle("is-on", on);
    });
    const work = $("work");
    const glance = $("glance");
    if (activePanel && PANEL_META[activePanel]) {
      work.classList.add("is-on");
      glance.classList.remove("is-show");
      const meta = PANEL_META[activePanel];
      $("workTitle").textContent = meta.title;
      $("workEn").textContent = meta.en;
      $("ctxHint").innerHTML = "<b>" + meta.title + "</b> · " + meta.hint;
    } else {
      work.classList.remove("is-on");
      if (!collapsed && !chatOpen) glance.classList.add("is-show");
      else glance.classList.remove("is-show");
      if (!chatOpen) $("ctxHint").textContent = "Esc 收起 · 点小岛开聊天";
    }
  }

  function renderWork() {
    const body = $("workBody");
    if (!activePanel) { body.innerHTML = ""; return; }
    if (activePanel === "todos") renderTodos(body);
    else if (activePanel === "notes") renderNotes(body);
    else if (activePanel === "clip") renderClip(body);
    else if (activePanel === "launch") renderLaunch(body);
    else if (activePanel === "search") renderSearch(body, "");
  }

  function renderTodos(body) {
    body.innerHTML = `
      <div class="row-add">
        <input class="field cut-sm" id="todoInput" placeholder="新增待办，回车添加" maxlength="80" />
        <button type="button" class="btn primary cut-sm" id="todoAdd">添加</button>
      </div>
      <div class="list" id="todoList"></div>`;
    const list = $("todoList");
    if (!todos.length) list.innerHTML = '<div class="empty">还没有待办。<br/>写下今天第一刀。</div>';
    else {
      list.innerHTML = todos.map(t => `
        <div class="todo-row cut-sm ${t.done ? "is-done" : ""}" data-id="${t.id}">
          <button type="button" class="chk" data-act="toggle" aria-label="完成">${t.done ? "✓" : ""}</button>
          <input class="tt" data-act="title" value="${escapeAttr(t.title)}" />
          <button type="button" class="del" data-act="del" title="删除">删</button>
        </div>`).join("");
    }
    const add = () => {
      const inp = $("todoInput");
      const title = (inp.value || "").trim();
      if (!title) return;
      todos.unshift({ id: uid(), title, done: false, updated: now() });
      persistTodos(); inp.value = ""; renderTodos(body); toast("待办已添加", true);
    };
    $("todoAdd").onclick = add;
    $("todoInput").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); add(); } };
    list.querySelectorAll(".todo-row").forEach(row => {
      const id = row.dataset.id;
      const t = todos.find(x => x.id === id);
      row.querySelector('[data-act="toggle"]').onclick = () => { t.done = !t.done; t.updated = now(); persistTodos(); renderTodos(body); };
      const titleInp = row.querySelector('[data-act="title"]');
      titleInp.onchange = () => {
        const v = titleInp.value.trim();
        if (!v) { titleInp.value = t.title; return; }
        t.title = v; t.updated = now(); persistTodos(); paintGlance(); toast("标题已保存", true);
      };
      row.querySelector('[data-act="del"]').onclick = () => {
        todos = todos.filter(x => x.id !== id); persistTodos(); renderTodos(body);
      };
    });
  }

  function renderNotes(body) {
    if (!activeNoteId || !notes.find(n => n.id === activeNoteId)) activeNoteId = notes[0] ? notes[0].id : null;
    const cur = notes.find(n => n.id === activeNoteId);
    body.innerHTML = `
      <div class="notes-wrap">
        <div class="row-add"><button type="button" class="btn primary cut-sm" id="noteNew" style="width:100%">新建笔记</button></div>
        <div class="notes-split">
          <div class="note-list" id="noteList"></div>
          <div class="note-ed" id="noteEd"></div>
        </div>
      </div>`;
    const list = $("noteList");
    list.innerHTML = notes.length ? notes.map(n => `
      <button type="button" class="item cut-sm ${n.id===activeNoteId?"is-on":""}" data-id="${n.id}">
        <div class="t">${escapeHtml(n.title || "无标题")}</div>
        <div class="m">${new Date(n.updated).toLocaleDateString("zh-CN")}</div>
      </button>`).join("") : '<div class="empty">暂无笔记</div>';
    list.querySelectorAll(".item").forEach(btn => {
      btn.onclick = () => { activeNoteId = btn.dataset.id; renderNotes(body); };
    });
    $("noteNew").onclick = () => {
      const id = uid();
      notes.unshift({ id, title: "未命名笔记", body: "", updated: now() });
      activeNoteId = id; persistNotes(); renderNotes(body); toast("已新建笔记", true);
    };
    const ed = $("noteEd");
    if (!cur) { ed.innerHTML = '<div class="empty">选择或新建一篇笔记</div>'; return; }
    ed.innerHTML = `
      <input class="title cut-sm field" id="noteTitle" value="${escapeAttr(cur.title)}" />
      <textarea class="cut-sm" id="noteBody" placeholder="开始书写…">${escapeHtml(cur.body)}</textarea>
      <div class="bar">
        <span class="saved" id="noteSaved">已同步本地</span>
        <button type="button" class="btn sm cut-sm" id="noteDel">删除</button>
      </div>`;
    let saveTimer;
    const flush = () => {
      cur.title = $("noteTitle").value.trim() || "未命名笔记";
      cur.body = $("noteBody").value; cur.updated = now(); persistNotes();
      $("noteSaved").textContent = "已保存 " + new Date().toLocaleTimeString("zh-CN", {hour:"2-digit", minute:"2-digit"});
      const btn = list.querySelector(`[data-id="${cur.id}"] .t`);
      if (btn) btn.textContent = cur.title;
    };
    const schedule = () => {
      $("noteSaved").textContent = "编辑中…";
      clearTimeout(saveTimer); saveTimer = setTimeout(flush, 400);
    };
    $("noteTitle").oninput = schedule; $("noteBody").oninput = schedule;
    $("noteTitle").onchange = flush; $("noteBody").onchange = flush;
    $("noteDel").onclick = () => {
      notes = notes.filter(n => n.id !== cur.id);
      activeNoteId = notes[0] ? notes[0].id : null;
      persistNotes(); renderNotes(body); toast("笔记已删除");
    };
  }

  function renderClip(body) {
    body.innerHTML = `
      <div class="row-add">
        <input class="field cut-sm" id="clipInput" placeholder="手动加入一条（demo）" />
        <button type="button" class="btn cut-sm" id="clipAdd">加入</button>
      </div>
      <div class="list" id="clipList"></div>
      <div style="margin-top:8px;display:flex;justify-content:flex-end">
        <button type="button" class="btn sm cut-sm" id="clipClose">取用后关闭面板</button>
      </div>`;
    const list = $("clipList");
    if (!clips.length) list.innerHTML = '<div class="empty">暂无剪贴板历史</div>';
    else list.innerHTML = clips.map(c => `
      <button type="button" class="item clip-item cut-sm" data-id="${c.id}">
        <div class="t">${escapeHtml(c.text)}</div>
        <div class="m">${new Date(c.ts).toLocaleString("zh-CN", {month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</div>
      </button>`).join("");
    list.querySelectorAll(".item").forEach(btn => {
      btn.onclick = async () => {
        const c = clips.find(x => x.id === btn.dataset.id);
        if (!c) return;
        try { await navigator.clipboard.writeText(c.text); } catch (_) {}
        toast("已复制到剪贴板", true);
      };
    });
    $("clipAdd").onclick = () => {
      const v = ($("clipInput").value || "").trim();
      if (!v) return;
      clips.unshift({ id: uid(), text: v, ts: now() });
      clips = clips.slice(0, 30); persistClip(); $("clipInput").value = ""; renderClip(body);
    };
    $("clipClose").onclick = () => setPanel(null);
  }

  function renderLaunch(body) {
    body.innerHTML = `<div class="list" id="launchList"></div>`;
    $("launchList").innerHTML = LAUNCHES.map(l => `
      <button type="button" class="item launch-item cut-sm" data-id="${l.id}">
        <div class="ico cut-sm">${l.kind.slice(0,1)}</div>
        <div><div class="t">${escapeHtml(l.name)}</div><div class="m">${escapeHtml(l.kind)} · ${escapeHtml(l.hint)}</div></div>
      </button>`).join("");
    $("launchList").querySelectorAll(".item").forEach(btn => {
      btn.onclick = () => {
        const l = LAUNCHES.find(x => x.id === btn.dataset.id);
        toast("已调起「" + l.name + "」· 回到穿透区", true);
        setPanel(null);
      };
    });
  }

  function renderSearch(body, preset) {
    body.innerHTML = `
      <input class="field cut-sm" id="searchInput" placeholder="搜索待办与笔记…" value="${escapeAttr(preset || "")}" />
      <div class="list" id="searchHits" style="margin-top:8px"></div>`;
    const run = () => {
      const q = ($("searchInput").value || "").trim().toLowerCase();
      const hits = [];
      if (q) {
        todos.forEach(t => {
          if (t.title.toLowerCase().includes(q)) hits.push({ kind: "todo", id: t.id, title: t.title, sub: t.done ? "已完成" : "待办" });
        });
        notes.forEach(n => {
          if ((n.title + "\n" + n.body).toLowerCase().includes(q))
            hits.push({ kind: "note", id: n.id, title: n.title || "无标题", sub: (n.body || "").slice(0, 36) });
        });
      }
      const box = $("searchHits");
      if (!q) box.innerHTML = '<div class="empty">输入关键词，点结果直达面板</div>';
      else if (!hits.length) box.innerHTML = '<div class="empty">没有匹配</div>';
      else box.innerHTML = hits.map(h => `
        <button type="button" class="item search-hit cut-sm" data-kind="${h.kind}" data-id="${h.id}">
          <div class="kind">${h.kind === "todo" ? "待办" : "笔记"}</div>
          <div class="t">${escapeHtml(h.title)}</div>
          <div class="m">${escapeHtml(h.sub || "")}</div>
        </button>`).join("");
      box.querySelectorAll(".item").forEach(btn => {
        btn.onclick = () => {
          if (btn.dataset.kind === "todo") setPanel("todos");
          else { activeNoteId = btn.dataset.id; setPanel("notes"); }
          toast("已直达", true);
        };
      });
    };
    $("searchInput").oninput = run;
    $("searchInput").onkeydown = e => { if (e.key === "Enter") run(); };
    if (preset) run();
    setTimeout(() => $("searchInput") && $("searchInput").focus(), 30);
  }

  /* ---- Shell collapse ---- */
  const hud = $("hud"), fx = $("fx"), evoke = $("btnEvoke");
  let flashTimer, ceremonyTimer;
  function applyCollapsed(withFlash, withCeremony) {
    clearTimeout(flashTimer); clearTimeout(ceremonyTimer);
    fx.classList.remove("is-flashout", "is-ceremony");
    document.body.classList.toggle("hud-open", !collapsed);
    if (!collapsed) {
      hud.classList.add("is-open");
      fx.classList.add("is-on");
      if (withCeremony) {
        fx.classList.add("is-ceremony");
        ceremonyTimer = setTimeout(() => fx.classList.remove("is-ceremony"), FLASH + 20);
      }
      evoke.classList.add("is-open");
      evoke.setAttribute("aria-expanded", "true");
      $("evokeLabel").textContent = "收起";
      applyLeftPanel();
    } else {
      hud.classList.remove("is-open");
      $("glance").classList.remove("is-show");
      evoke.classList.remove("is-open");
      evoke.setAttribute("aria-expanded", "false");
      $("evokeLabel").textContent = "展开";
      if (withFlash && fx.classList.contains("is-on")) {
        fx.classList.add("is-flashout");
        flashTimer = setTimeout(() => fx.classList.remove("is-on", "is-flashout", "is-ceremony"), FLASH);
      } else fx.classList.remove("is-on", "is-ceremony");
    }
  }
  function setCollapsed(v) {
    const wasOpen = !collapsed;
    collapsed = v;
    applyCollapsed(wasOpen && collapsed, !collapsed);
    try { localStorage.setItem(LS.collapse, collapsed ? "1" : "0"); } catch (_) {}
    if (!collapsed) {
      try {
        if (!localStorage.getItem(LS.hint)) {
          localStorage.setItem(LS.hint, "1");
          toast("点小岛开聊天 · Esc 收起头盔");
        }
      } catch (_) { toast("点小岛开聊天 · Esc 收起头盔"); }
    }
  }

  /* events */
  $("island").addEventListener("click", (e) => {
    if (e.target.closest(".island-gear") || e.target.closest(".hours-pop") || e.target.closest(".island-chat")) return;
    if (chatOpen) return; // already open; use 收起 button
    setChatOpen(true);
  });
  $("island").addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (!chatOpen) setChatOpen(true); }
  });

  $("btnHours").addEventListener("click", e => {
    e.stopPropagation();
    $("inStart").value = hours.start;
    $("inEnd").value = hours.end;
    $("hoursPop").classList.toggle("is-on");
  });
  $("btnHoursCancel").onclick = e => { e.stopPropagation(); $("hoursPop").classList.remove("is-on"); };
  $("btnHoursSave").onclick = e => {
    e.stopPropagation();
    hours = { start: $("inStart").value || "09:30", end: $("inEnd").value || "22:30" };
    persistHours(); $("hoursPop").classList.remove("is-on");
    toast("工作窗口已保存", true);
  };

  evoke.addEventListener("click", () => setCollapsed(!collapsed));
  window.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if ($("hoursPop").classList.contains("is-on")) { $("hoursPop").classList.remove("is-on"); return; }
      if (chatOpen) { setChatOpen(false); return; }
      if (activePanel && !collapsed) { setPanel(null); return; }
      setCollapsed(!collapsed);
    }
  });

  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      if (collapsed) setCollapsed(false);
      setPanel(btn.dataset.panel);
    });
  });
  $("btnClosePanel").onclick = () => setPanel(null);

  $("botSearch").addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const q = $("botSearch").value.trim();
      if (collapsed) setCollapsed(false);
      if (chatOpen) setChatOpen(false);
      activePanel = "search";
      try { localStorage.setItem(LS.panel, "search"); } catch (_) {}
      applyLeftPanel();
      renderSearch($("workBody"), q);
    }
  });

  $("desktop").addEventListener("click", e => {
    const hit = document.createElement("div");
    hit.className = "desk-hit show";
    hit.style.left = (e.offsetX - 4) + "px";
    hit.style.top = (e.offsetY - 4) + "px";
    $("desktop").appendChild(hit);
    setTimeout(() => hit.remove(), 420);
  });

  paintRing(); paintGlance(); paintBadges();
  applyCollapsed(false, false);
  if (chatOpen) setChatOpen(true);
  else if (!collapsed) { applyLeftPanel(); renderWork(); }
  setInterval(paintRing, 30000);
})();

</script>
</body>
</html>
