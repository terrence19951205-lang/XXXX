<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>shell-hub</title>
  <desc>App icon for shell-hub. Not x-hub. Void + cyan geometric S + HUD hex.</desc>
  <defs>
    <linearGradient id="sGrad" x1="150" y1="110" x2="360" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4FECFF"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00C2DA"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#02040A"/>
  <rect x="34" y="34" width="444" height="444" rx="94" fill="#0A1018"/>
  <polygon points="256,82 386,157 386,355 256,430 126,355 126,157"
           fill="none" stroke="#00E5FF" stroke-opacity="0.28" stroke-width="7"/>
  <!-- continuous geometric S -->
  <path d="M 332 150
           C 332 108 298 90 256 90
           C 196 90 154 122 154 170
           C 154 214 186 236 246 254
           C 310 274 358 300 358 352
           C 358 410 312 430 256 430
           C 196 430 160 398 160 352"
        stroke="url(#sGrad)" stroke-width="48" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <path d="M96 96H138M96 96V138" stroke="#00E5FF" stroke-width="6" stroke-linecap="square"/>
  <path d="M416 96H374M416 96V138" stroke="#00E5FF" stroke-width="6" stroke-linecap="square"/>
  <path d="M96 416H138M96 416V374" stroke="#00E5FF" stroke-width="6" stroke-linecap="square"/>
  <path d="M416 416H374M416 416V374" stroke="#00E5FF" stroke-width="6" stroke-linecap="square"/>
  <circle cx="352" cy="148" r="9" fill="#FF2E97"/>
</svg>
